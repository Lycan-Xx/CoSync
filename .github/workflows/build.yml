name: CoSync Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build Windows desktop
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable MSVC Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Show toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          protoc --version

      - name: Run core tests
        run: cargo test -p cosync-core

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Read desktop version
        id: app-version
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows installers
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}-build.${{ github.run_number }}
          name: CoSync v${{ steps.app-version.outputs.version }} build ${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
