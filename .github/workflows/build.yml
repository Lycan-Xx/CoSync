name: CoSync Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Test and build Windows desktop
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable MSVC Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Show toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          protoc --version

      - name: Run core tests
        run: cargo test -p cosync-core

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows installers
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: cosync-windows-installers
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    name: Test and build Linux desktop
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install stable Linux Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Show toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          protoc --version

      - name: Run core tests
        run: cargo test -p cosync-core

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Linux bundles
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: cosync-linux-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm

  android:
    name: Test and build Android mobile app
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Build Rust mobile libraries
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86 \
            -t x86_64 \
            build -p cosync-core --release --features mobile-bindings

      - name: Generate Kotlin UniFFI bindings
        run: |
          mkdir -p \
            apps/mobile/android/app/src/main/jniLibs/armeabi-v7a \
            apps/mobile/android/app/src/main/jniLibs/arm64-v8a \
            apps/mobile/android/app/src/main/jniLibs/x86 \
            apps/mobile/android/app/src/main/jniLibs/x86_64
          cp target/armv7-linux-androideabi/release/libcosync_core.so \
            apps/mobile/android/app/src/main/jniLibs/armeabi-v7a/
          cp target/aarch64-linux-android/release/libcosync_core.so \
            apps/mobile/android/app/src/main/jniLibs/arm64-v8a/
          cp target/i686-linux-android/release/libcosync_core.so \
            apps/mobile/android/app/src/main/jniLibs/x86/
          cp target/x86_64-linux-android/release/libcosync_core.so \
            apps/mobile/android/app/src/main/jniLibs/x86_64/
          mkdir -p apps/mobile/android/app/src/main/java/uniffi
          cargo run --manifest-path tools/uniffi-bindgen/Cargo.toml -- \
            generate \
            --library target/aarch64-linux-android/release/libcosync_core.so \
            --language kotlin \
            --out-dir apps/mobile/android/app/src/main/java/uniffi

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build Android release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cosync-android-apk
          if-no-files-found: error
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  release:
    name: Publish cross-platform release
    needs: [windows, linux, android]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read desktop version
        id: app-version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cosync-*-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.app-version.outputs.version }}-build.${{ github.run_number }}
          name: CoSync v${{ steps.app-version.outputs.version }} build ${{ github.run_number }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
