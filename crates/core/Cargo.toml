[package]
name = "cosync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Wire protocol (Envelope + payload types), generated from proto/cosync.proto
prost = "0.12"

# PairingPayload (QR-code JSON), not part of the ongoing wire protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DeviceIdentity keypair + fingerprint
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Cross-platform app-data directory for keystore persistence
directories = "5"

thiserror = "1"

# Certificate expiry (used only in cert.rs)
time = "0.3"

# Discovery (Milestone 2)
mdns-sd = "0.10"

# Transport (Milestone 2): QUIC over TLS 1.3 with a pinned self-signed cert
# (no CA — see ADR-003/ADR-005). Older 0.10/0.21 line chosen deliberately
# for MSRV reasons — see ADR-004.
quinn = "0.10"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rcgen = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

# Paired-device persistence (Milestone 2's paired_devices table)
rusqlite = { version = "0.31", features = ["bundled"] }

# Mobile FFI bindings (Rust -> Kotlin). Kept behind a feature flag so the
# desktop (Tauri) build doesn't pull this in at all.
uniffi = { version = "0.25", optional = true }

[build-dependencies]
prost-build = "0.12"
uniffi = { version = "0.25", features = ["build"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
mobile-bindings = ["dep:uniffi"]
